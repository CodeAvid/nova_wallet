name: nova_wallet
description: "NovaWallet Mobile — Send & Save: a FirstBank NovaPay take-home Flutter app."
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  bloc: ^9.2.1
  connectivity_plus: ^7.3.1
  dart_mappable: ^4.8.0
  drift: '>=2.33.0 <2.34.6'
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  fluttertoast: ^8.2.8
  go_router: ^18.0.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.6.0

dev_dependencies:
  bdd_widget_test: ^2.1.4
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.15.1
  dart_mappable_builder: ^4.8.0
  drift_dev: ^2.35.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

# go_router 18 pulls material_ui/cupertino_ui; 1.3.0/1.1.0 use
# @awaitNotRequired, which is not in Dart 3.12.1 (Flutter 3.44.1).
dependency_overrides:
  cupertino_ui: 1.0.2
  material_ui: 1.2.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/mock/fake_backend.json
